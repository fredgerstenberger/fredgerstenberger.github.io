<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<meta name="description" content="Recipe Box is at app.bakfan.com.">
<meta name="theme-color" content="#E4E8EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Recipe Box lives at app.bakfan.com. Links keep what they carry (?add=, ?url=, …), so shortcuts still work. -->
<script src="redirect.js"></script>
<noscript><meta http-equiv="refresh" content="0; url=https://app.bakfan.com/"></noscript>
<style>
  :root { --bg: #F4F2EE; --ink: #1B232B; --accent: #2448CC; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121A22; --ink: #E8ECEF; --accent: #7C95FF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main><p>Recipe Box is at <a href="https://app.bakfan.com/">app.bakfan.com</a>.</p></main>
