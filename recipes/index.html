<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Recipe Box</title>
<meta name="description" content="Save recipes from any site, plan the week and get a grocery list.">
<meta name="theme-color" content="#E4E8EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    const t = JSON.parse(localStorage.getItem("recipebox.v1") || "{}").settings?.theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<div id="timers" class="timerdock" hidden aria-label="Timers"></div>
<dialog class="win" id="modal" aria-labelledby="modal-title">
  <div class="titlebar">
    <span class="tb-left"><button class="backbtn" id="modal-close" aria-label="Close"></button></span>
    <h2 class="wintitle" id="modal-title"></h2>
    <span class="tb-right"></span>
  </div>
  <div class="wbody" id="modal-body"></div>
</dialog>
<div id="toast" class="toast win" hidden role="status"></div>
<noscript><p style="padding:20px">Recipe Box needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
