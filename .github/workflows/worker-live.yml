# Live tests against your deployed Cloudflare Worker (they use a little of your free Workers AI allowance,
# so they only run when you start them: Actions → Worker live tests → Run workflow).
# Needs repository secrets: WORKER_URL (e.g. https://recipe-proxy.<you>.workers.dev) and APP_KEY (if set).
name: Worker live tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live tests (POST /label and /status)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: npm run test:live
