# Runs the tests of recipes/ (now only a redirect to app.bakfan.com; the app lives in the recipe-box repo)
# on every pull request and every push to main.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check the redirect
        run: for f in redirect.js sw.js js/version.js; do node --check "$f" || exit 1; done
      - name: Tests
        run: npm test
